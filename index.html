<!doctype html><html><head><meta charset="utf-8"><title>Content Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root { color-scheme: dark; }
body { background:#111; color:#eee; font-family:-apple-system,Segoe UI,Arial,sans-serif; margin:0; padding:24px; }
h1 { font-size:22px; margin-bottom:4px; }
nav a { color:#7cc4ff; margin-right:16px; text-decoration:none; font-size:14px; }
.grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-top:20px; }
@media (max-width:1400px){ .grid{ grid-template-columns:repeat(4,1fr);} }
@media (max-width:1100px){ .grid{ grid-template-columns:repeat(3,1fr);} }
@media (max-width:800px){ .grid{ grid-template-columns:repeat(2,1fr);} }
@media (max-width:500px){ .grid{ grid-template-columns:1fr;} }
.card { background:#1c1c1c; border-radius:10px; padding:10px; display:flex; flex-direction:column; }
.card video, .card img.main { width:100%; border-radius:6px; background:#000; max-height:340px; object-fit:contain; }
.vwrap, .cwrap { position:relative; }
.playbtn {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:56px; height:56px; border-radius:50%; background:rgba(0,0,0,.45);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:opacity .15s; pointer-events:auto;
}
.playbtn::after {
  content:""; border-style:solid; border-width:12px 0 12px 20px;
  border-color:transparent transparent transparent rgba(255,255,255,.85);
  margin-left:4px;
}
.playbtn.hidden { opacity:0; pointer-events:none; }
.carousel-nav {
  position:absolute; top:50%; transform:translateY(-50%);
  width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,.4);
  color:rgba(255,255,255,.85); display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:18px; user-select:none;
}
.carousel-nav.prev { left:6px; }
.carousel-nav.next { right:6px; }
.thumbs { display:flex; gap:4px; margin-top:4px; overflow-x:auto; }
.thumbs img { height:44px; border-radius:4px; cursor:pointer; opacity:.7; }
.thumbs img.active { opacity:1; outline:2px solid #7cc4ff; }
.stats { font-size:12px; color:#9c9; margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; }
.stats span { background:#242424; padding:2px 6px; border-radius:4px; }
.owner { font-size:11px; color:#888; margin-top:4px; }
.section-label { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#7cc4ff; margin-top:8px; }
.text { font-size:12.5px; line-height:1.4; color:#ccc; margin-top:4px; white-space:pre-wrap; max-height:160px; overflow-y:auto; }
.note { font-size:12px; color:#e88; }
a.origlink { font-size:11px; color:#7cc4ff; }
</style>
</head><body>
